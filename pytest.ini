[pytest]
# Pytest configuration for Phase 7 testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode (pytest-asyncio)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output options
# Verbose, short traceback, strict markers, disable warnings, max failures, timeout
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings
    --maxfail=5
    --timeout=30

# Coverage options
# Run with: pytest --cov=. --cov-report=html
[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    */.venv/*
    */migrations/*
    */data/*
    test_*.py
    conftest.py

[coverage:report]
precision = 2
skip_empty = True
show_missing = True

[coverage:html]
directory = htmlcov
