# Nginx Configuration for FastAPI + Flask Blue-Green Deployment
# Location: /etc/nginx/sites-enabled/default

# Upstream backend servers
# Adjust weights for gradual rollout: 10% → 25% → 50% → 75% → 100%
upstream backend {
    # Phase 1: 10% FastAPI, 90% Flask
    server localhost:5000 weight=90;  # Flask (Blue)
    server localhost:8000 weight=10;  # FastAPI (Green)

    # Phase 2: 25% FastAPI
    # server localhost:5000 weight=75;
    # server localhost:8000 weight=25;

    # Phase 3: 50% FastAPI
    # server localhost:5000 weight=50;
    # server localhost:8000 weight=50;

    # Phase 4: 75% FastAPI
    # server localhost:5000 weight=25;
    # server localhost:8000 weight=75;

    # Phase 5: 100% FastAPI (decommission Flask)
    # server localhost:8000;

    keepalive 32;  # Keep 32 connections open for performance
}

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Max body size (for large requests)
    client_max_body_size 10M;

    # Timeout settings
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Location: API endpoints
    location / {
        proxy_pass http://backend;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable buffering for streaming responses
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint (bypass load balancing)
    location /health {
        proxy_pass http://localhost:8000/health;
        proxy_set_header Host $host;
        access_log off;  # Don't log health checks
    }

    # Static files (if serving from Nginx)
    location /static {
        alias /var/www/rag-documentation-assistant/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
    }
}

